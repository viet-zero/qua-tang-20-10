<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#100516">
<title>Gửi em — 20/10 💗</title>
<style>
  :root { --pink:#ff5ca8; --hot:#ff2e72; --soft:#ffc4e2; --night:#09030d; }
  * { box-sizing:border-box; }
  html,body { margin:0; width:100%; min-height:100%; }
  body {
    min-height:100svh; overflow:hidden; position:relative; color:#fff;
    background:radial-gradient(ellipse at 50% 45%, #32102d 0%, #17091d 38%, #08030c 78%);
    font-family: Georgia, "Times New Roman", serif;
  }
  #stars, #messages { position:fixed; inset:0; pointer-events:none; overflow:hidden; }
  .star { position:absolute; width:2px; height:2px; border-radius:50%; background:#fff; opacity:.65; animation:twinkle 2s infinite ease-in-out alternate; }
  @keyframes twinkle { from{opacity:.15;transform:scale(.7)} to{opacity:.9;transform:scale(1.5)} }
  .message {
    position:absolute; white-space:nowrap; color:#ff9bcf; font-weight:bold;
    text-shadow:0 0 7px #ff3c9a, 0 0 17px #ff4baf;
    animation:floatMessage var(--dur,8s) linear forwards;
    opacity:0; will-change:transform,opacity;
  }
  .message .tiny-heart { display:inline-block; color:#ff456e; margin-left:5px; animation:tinyBeat .7s infinite; }
  @keyframes floatMessage {
    0% { opacity:0; transform:translate3d(var(--x0), 25px, 0) rotate(var(--rot)); }
    10%,82% { opacity:var(--op,.9); }
    100% { opacity:0; transform:translate3d(var(--x1), -35px, 0) rotate(var(--rot)); }
  }
  @keyframes tinyBeat { 0%,100%{transform:scale(.8)} 50%{transform:scale(1.25)} }
  .center {
    position:fixed; z-index:3; left:50%; top:50%; transform:translate(-50%,-50%);
    width:min(92vw,440px); text-align:center; padding:20px 12px;
  }
  .center h1 { font-size:clamp(25px,7vw,43px); line-height:1.15; margin:0 0 13px; color:#fff0fa;
    text-shadow:0 0 8px #ff5ba8, 0 0 24px #ff287d; animation:titleGlow 2.2s ease-in-out infinite alternate; }
  .center p { margin:6px 0; font-size:clamp(13px,3.7vw,17px); color:#ffd4e9; text-shadow:0 0 8px #ff3c9a; }
  @keyframes titleGlow { from{filter:brightness(.85);text-shadow:0 0 7px #ff5ba8} to{filter:brightness(1.25);text-shadow:0 0 14px #ff5ba8,0 0 34px #ff287d} }
  .big-heart {
    display:block; border:0; background:none; color:#ff315f; cursor:pointer; padding:0;
    margin:8px auto 10px; font-size:clamp(88px,24vw,145px); line-height:1;
    filter:drop-shadow(0 0 9px #ff285d) drop-shadow(0 0 25px #ff286d);
    animation:heartbeat 1.05s infinite; transform-origin:center;
    -webkit-tap-highlight-color:transparent;
  }
  @keyframes heartbeat { 0%,100%{transform:scale(1)} 14%{transform:scale(1.14)} 28%{transform:scale(1)} 42%{transform:scale(1.1)} 56%{transform:scale(1)} }
  .hint { font:12px Arial,sans-serif; opacity:.68; margin-top:17px!important; }
  .sparkle { position:absolute; z-index:2; pointer-events:none; font-size:20px; animation:burst 1.2s ease-out forwards; }
  @keyframes burst { from{opacity:1;transform:translate(0,0) scale(.5)} to{opacity:0;transform:translate(var(--bx),var(--by)) scale(1.6)} }
  .footer { position:fixed; bottom:12px; width:100%; text-align:center; color:#b985a7; font:11px Arial,sans-serif; opacity:.65; z-index:4; }
  @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:4s!important; } }
</style>
</head>
<body>
<div id="stars"></div><div id="messages"></div>
<main class="center">
  <h1>Gửi cô gái anh thương 💗</h1>
  <p>20/10 — Chúc em luôn xinh đẹp và hạnh phúc</p>
  <button class="big-heart" id="heart" aria-label="Chạm vào trái tim">💗</button>
  <p id="sweet">Anh yêu em nhiều hơn những gì anh nói được.</p>
  <p>Ở đâu có em, ở đó là điều dịu dàng nhất. ❤️</p>
  <p class="hint">Chạm vào trái tim để nhận một lời yêu thương ✨</p>
</main>
<div class="footer">Made with love, dành riêng cho em ♡</div>
<script>
const phrases = [
  "Anh yêu em", "Anh nhớ em", "Em là điều tuyệt vời nhất ❤️",
  "Mãi là công chúa của anh", "Cảm ơn vì đã ở đây 💗",
  "Anh thương em nhiều lắm", "Mong em luôn hạnh phúc nhé",
  "Có em, ngày nào cũng đẹp", "Em là nhà của anh 🏡",
  "Nhớ em một chút… thật ra là rất nhiều", "Anh luôn ở đây vì em",
  "Nụ cười của em là điều anh thích nhất", "Yêu em hôm nay và ngày mai",
  "Em xứng đáng với mọi điều tốt đẹp", "Ôm em một cái thật lâu 🫶",
  "Thế giới của anh có màu hồng từ ngày gặp em", "Bé iu ơi 💞",
  "20/10 vui vẻ nhé, tình yêu của anh", "Anh chọn em, vẫn luôn là em",
  "Mỗi ngày đều muốn làm em vui", "Em là chiếc ôm anh muốn trở về",
  "Gặp em là một điều may mắn", "Thương em hơn hôm qua một chút",
  "Anh muốn cùng em tạo thật nhiều kỷ niệm", "Trái tim anh có tên em 💘"
];
const stars = document.getElementById('stars');
const layer = document.getElementById('messages');
const sweet = document.getElementById('sweet');
for(let i=0;i<95;i++){
  const s=document.createElement('i'); s.className='star';
  s.style.left=Math.random()*100+'%'; s.style.top=Math.random()*100+'%';
  s.style.animationDelay=(Math.random()*3)+'s'; s.style.animationDuration=(1.3+Math.random()*2.5)+'s';
  stars.appendChild(s);
}
function spawnMessage(initial=false){
  const el=document.createElement('div'); el.className='message';
  const phrase=phrases[Math.floor(Math.random()*phrases.length)];
  el.innerHTML=`${phrase}<span class="tiny-heart">♥</span>`;
  const size=11+Math.random()*9;
  el.style.fontSize=size+'px';
  el.style.left=(Math.random()*82+2)+'vw';
  el.style.top=(Math.random()*94+2)+'vh';
  el.style.setProperty('--dur',(6+Math.random()*7)+'s');
  el.style.setProperty('--x0',(Math.random()*24-12)+'px');
  el.style.setProperty('--x1',(Math.random()*90-45)+'px');
  el.style.setProperty('--rot',(Math.random()*12-6)+'deg');
  el.style.setProperty('--op',(.5+Math.random()*.5).toFixed(2));
  layer.appendChild(el);
  setTimeout(()=>el.remove(),14000);
}
for(let i=0;i<28;i++) setTimeout(()=>spawnMessage(true),i*180);
setInterval(()=>spawnMessage(),360);
function burst(){
  const heart=document.getElementById('heart');
  const rect=heart.getBoundingClientRect();
  for(let i=0;i<15;i++){
    const e=document.createElement('span'); e.className='sparkle'; e.textContent=['💗','💕','✨','❤️'][Math.floor(Math.random()*4)];
    e.style.left=(rect.left+rect.width/2)+'px'; e.style.top=(rect.top+rect.height/2)+'px';
    e.style.setProperty('--bx',(Math.random()*300-150)+'px');
    e.style.setProperty('--by',(Math.random()*260-130)+'px');
    document.body.appendChild(e); setTimeout(()=>e.remove(),1300);
  }
  sweet.textContent=phrases[Math.floor(Math.random()*phrases.length)]+' 💖';
}
document.getElementById('heart').addEventListener('click',burst);
</script>
</body>
</html>
